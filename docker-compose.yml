version: "3.9"
services:
  nayose:
    build: .
    ports:
      - "8899:8000"
    environment:
      NAYOSE_DATA_DIR: /app/data/current
      NAYOSE_MODELS_DIR: /app/models
      NAYOSE_OPERATIONAL_DB: /app/data/operational.sqlite3
      NAYOSE_DASH_PORT: "8000"
      # The container binds to all interfaces; fail closed unless a token is supplied.
      NAYOSE_API_TOKEN: ${NAYOSE_API_TOKEN:?set NAYOSE_API_TOKEN before starting the container}
      # Preloads the recommend engine so the first request is not a cold start:
      # NAYOSE_WARM_EMBED: "1"
    volumes:
      - ./data:/app/data            # generations + current (immutable)
      - ./models:/app/models        # immutable runs + current
    restart: unless-stopped