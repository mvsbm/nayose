schema_version = 1

[paths]
data_root = "data"
data_dir = "data/current"
models_dir = "models"
frontend_dir = "frontend"
operational_db = "data/operational.sqlite3"

[serving]
bind_host = "127.0.0.1"
port = 8000
auth_mode = "local_bearer"
trusted_auth_subject_header = "X-Authenticated-User"
trusted_auth_scopes_header = "X-Authenticated-Scopes"
debug_sql = false
warm_embed = false
default_reviewer = "web"
device = "mps"
exact_mode = "hybrid"

[embedding]
model_id = "codefuse-ai/F2LLM-v2-330M"
device = "mps"
batch_size = 32
process_workers = 1
torch_dtype = "float16"
revision = ""

[performance]
process_workers = 1
cpu_threads = 0
model_threads = 0
native_thread_cap = 0

[retrieval]
use_dense = true
dense_views = true
index_backend = "polars"
sparse_query_feature_cap = 64
sparse_batch_size = 32
inverted_memory_budget = 1000000000
encode_chunk_size = 1024

[inference]
sparse_top_k = 16
exact_block_cap = 50
candidate_cap = 50
pair_auto_threshold = 0.105
entity_auto_threshold = 0.016
entity_review_threshold = 0.016
entity_margin_threshold = 0.06
minimum_evidence_families = 2
minimum_reference_density = 0.0
dense_profile = "record_hybrid"
entity_override = false

[training]
seed = 42
model_family = "off"
use_dense = true
exact_mode = "hybrid"
strict_backends = false
decision_profile = "audit"
allow_svd_dense_fallback = true
svd_dimensions = 32
low_memory_models = true
pair_model_backend = "auto"
exact_block_cap = 80
sparse_top_k = 24
dense_top_k = 16
candidate_cap_per_record = 80
sparse_batch_size = 512
neural_batch_size = 32
rerank_top_k = 5
rerank_pair_limit = 12000
embedding_dim = 256
training_negatives_per_positive = 6
pair_auto_precision_target = 0.985
pair_review_precision_target = 0.80
entity_auto_precision_target = 0.97
entity_review_threshold = 0.20
entity_margin_threshold = 0.06
minimum_evidence_families = 2
minimum_reference_density = 0.0
max_full_match_records = 100000
pair_feature_batch = 100000
save_all_candidate_pairs = false
entity_scoring_mode = "logistic_v1"

[training.model_specs.off]
embedding = ""
reranker = ""
query_prefix = ""
document_prefix = ""

[training.model_specs.f2llm]
embedding = "codefuse-ai/F2LLM-v2-330M"
reranker = ""
query_prefix = ""
document_prefix = ""

[training.model_specs.f2llm_0_6b]
embedding = "codefuse-ai/F2LLM-v2-0.6B"
reranker = ""
query_prefix = ""
document_prefix = ""

[training.model_specs.ruri]
embedding = "cl-nagoya/ruri-v3-130m"
reranker = "cl-nagoya/ruri-v3-reranker-310m"
query_prefix = ""
document_prefix = ""

[training.model_specs.qwen]
embedding = "Qwen/Qwen3-Embedding-0.6B"
reranker = "Qwen/Qwen3-Reranker-0.6B"
query_prefix = "Instruct: Match this Japanese insurance customer to an existing party.\nQuery: "
document_prefix = "Document: "

[release]
min_top1_gain = 0.01
min_recall5_gain = 0.01
min_hard_recall5_gain = 0.01

[tooling]
metrics_dir = ""
architecture_ledger = ""
e2e = false

[generation]
seed = 42
max_entity_seeds = 2000000
default_stale_rate = 0.09
default_landline_share = 0.12
snapshot_date = "2025-12-31"
query_date = "2026-08-25"
profile = "generate_only"
default_difficulty = "realistic"
n_agencies = 18
person_share = 0.90
query_share = 0.16
twin_rate = 0.15
lineage_mode = "changed_plus_queries"

