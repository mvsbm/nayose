[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nayose"
version = "3.0.0"
description = "Japanese insurance entity resolution: synthetic data engine + matcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pykakasi>=2.3",
    "jaconv>=0.3",
    "phonenumbers>=8.13",
    "datasets>=2.19",
    "pyarrow>=14",
]

[project.optional-dependencies]
matcher = [
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "gradio>=4",
]
neural = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "usearch>=2.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data", "models", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # function calls in argument defaults (standard for dataclass factories)

# Legacy app modules: stable public surface (nayose_cli/nayose_inference). They run
# clean today; bring them under full lint/format discipline in the follow-up refactor.
[tool.ruff.lint.per-file-ignores]
"nayose_cli.py" = ["E501", "E402", "B905", "B007"]
"nayose_inference.py" = ["E501", "E402", "B905", "B007"]
"synthetic/report.py" = ["E501"]  # template literals (CSS/JS/HTML strings)

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["build/", ".venv/", "nayose_inference.py", "nayose_cli.py"]

# pandas ships no stubs in this env; numpy 2.x stubs require py3.12 syntax.
# Both are treated as Any (their behavior is covered by runtime tests).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*", "datasets", "pykakasi", "jaconv", "phonenumbers", "JP.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib", "scipy.*", "sklearn.*", "duckdb", "fastapi", "starlette.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nayose_inference", "nayose_cli"]
follow_imports = "skip"
ignore_missing_imports = true