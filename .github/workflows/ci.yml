name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --extra matcher --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy synthetic tests
      - name: Tests
        run: uv run pytest tests/ -q

  # Optional: heavy end-to-end gate, run on schedule/on-demand (downloads real data).
  e2e:
    name: Data-generation smoke (E2E)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --extra matcher
      - name: Generate smoke dataset
        run: uv run python scripts/generate_data.py --profile smoke --data-dir /tmp/smoke
      - name: Verify contract
        run: |
          uv run python - <<'PY'
          import json, pandas as pd
          for t in ("record_truth", "evaluation_truth", "query_truth", "field_lineage"):
              df = pd.read_parquet(f"/tmp/smoke/ground_truth/{t}.parquet")
              assert len(df) > 0, t
          ref = pd.read_parquet("/tmp/smoke/reference_records.parquet")
          assert ref.record_id.is_unique and "truth_id" not in ref.columns
          print("contract OK")
          PY