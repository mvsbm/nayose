name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  UV_SYNC_EXTRA: matcher,performance,serve,dev

jobs:
  ## The one authoritative quality gate: api.cli audit repo
  ## (ruff, mypy, tsc, npm test, pytest incl. schema + arch contracts + frontend gate).
  gate:
    name: Audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --frozen --extra matcher --extra performance --extra serve --extra dev
      - name: Frontend deps
        run: npm --prefix frontend ci
      - name: Check generated architecture diagrams
        run: uv run python scripts/generate_architecture_diagrams.py --check
      - name: Check release packaging invariants
        run: uv run python scripts/check_release_candidate.py
      - name: Audit (authoritative)
        run: |
          mkdir -p /tmp/nayose-metrics
          NAYOSE_METRICS_DIR=/tmp/nayose-metrics \
            uv run python -m api.cli benchmark measure \
              --label audit \
              --output /tmp/nayose-metrics/audit.json \
              -- python -m api.cli audit repo
      - name: Parse compiler diagnostics
        if: always()
        run: |
          uv run python -m api.cli audit tsc \
            --input /tmp/nayose-metrics/tsc.txt \
            --output /tmp/nayose-metrics/typescript.json
      - name: Check audit resource budget
        if: always()
        run: |
          uv run python -m api.cli audit resource \
            --metrics-dir /tmp/nayose-metrics \
            --only audit
          uv run python -m api.cli audit compiler \
            --metrics /tmp/nayose-metrics/typescript.json
      - name: Upload audit metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-metrics
          path: /tmp/nayose-metrics
          if-no-files-found: error
          retention-days: 14

  ## Daily on-demand / PR end-to-end smoke: generate → headless train → verify
  ## bundle → Playwright E2E against the freshly trained smoke bundle.
  data-smoke:
    name: Data + train smoke (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: gate
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --frozen --extra matcher --extra performance --extra serve --extra dev
      - name: Prepare workflow metrics
        run: mkdir -p /tmp/nayose-metrics
      - name: Generate smoke data
        run: |
          uv run python -m api.cli benchmark measure \
            --label generate_smoke \
            --output /tmp/nayose-metrics/generate_smoke.json \
            -- python -m api.cli data generate --profile smoke --seed 7 --data-dir /tmp/smoke
      - name: Train headless + verify bundle
        run: |
          uv run python -m api.cli benchmark measure \
            --label train_smoke \
            --output /tmp/nayose-metrics/train_smoke.json \
            -- python -m api.cli model train --data-dir /tmp/smoke --models-dir /tmp/models \
              --seed 7 --device cpu --model-family off --prune-aborted
          uv run python -m api.cli benchmark measure \
            --label audit_decisions \
            --output /tmp/nayose-metrics/audit_decisions.json \
            -- python -m api.cli audit decisions --models-dir /tmp/models --data-dir /tmp/smoke
      - name: E2E (Playwright) against the trained smoke bundle
        run: |
          npm --prefix frontend ci
          npx --prefix frontend playwright install chromium
          NAYOSE_E2E=1 \
          NAYOSE_E2E_METRICS=/tmp/nayose-metrics/browser.json \
          NAYOSE_E2E_MODELS=/tmp/models \
          NAYOSE_E2E_DATA="$(realpath /tmp/smoke/current)" \
            uv run python -m api.cli benchmark measure \
              --label e2e \
              --output /tmp/nayose-metrics/e2e.json \
              -- npm --prefix frontend run test:e2e
      - name: Check smoke resource and communication budgets
        if: always()
        run: |
          uv run python -m api.cli audit resource \
            --metrics-dir /tmp/nayose-metrics \
            --only generate_smoke train_smoke audit_decisions e2e \
            --browser-metrics /tmp/nayose-metrics/browser.json
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: /tmp/nayose-e2e-artifacts-*/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload workflow metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-workflow-metrics
          path: /tmp/nayose-metrics
          if-no-files-found: error
          retention-days: 14
      - name: Upload pipeline ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-pipeline-ledgers
          path: |
            /tmp/smoke/generations/*/workflow_metrics.json
            /tmp/models/runs/*/workflow_metrics.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bundle
          path: |
            /tmp/models/runs/*/run_manifest.json
            /tmp/models/runs/*/workflow_metrics.json
          retention-days: 30

  ## Container image → GHCR, built on version tags (vX.Y.Z).
  image:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [gate, data-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max