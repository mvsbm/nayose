name: Feature proposal
description: Propose a focused user or operator outcome
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current limitation and who is affected.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and boundaries
      description: Identify likely owning layers, explicit non-goals, and compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and evidence
      description: Include security, privacy, accessibility, performance, and operational considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler approaches or workarounds were evaluated?
