<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nayose 照合監査ダッシュボード — エンティティ照合の検索・レビュー・監査">
  <meta name="theme-color" content="#f6f7fb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; form-action 'self'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <title>Nayose 照合監査</title>
  <link rel="stylesheet" href="/static/fonts/noto-sans-jp.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#view" data-i18n="skip">本文へスキップ</a>
  <header class="app-bar">
    <button id="nav-toggle" class="side-toggle button-toolbar" type="button" aria-controls="primary-navigation" aria-expanded="true" aria-label="ナビゲーションを折りたたむ"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#menu"></use></svg><span class="side-toggle-label">ナビゲーションを折りたたむ</span></button>
    <div class="app-bar-title">
      <h1><span class="app-bar-name">Nayose</span><span id="view-title" class="app-bar-context">照合監査</span></h1>
    </div>
    <button id="cmd" type="button" class="app-bar-command button-toolbar" data-i18n-aria="palette" aria-label="コマンドパレット"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#search"></use></svg><span data-i18n="paletteHintShort">検索または移動</span><kbd>⌘K</kbd></button>
    <div class="app-bar-actions">
      <details class="run-context toolbar-popover">
        <summary class="button-toolbar"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#database"></use></svg><span data-i18n="run">実行バンドル</span></summary>
        <div class="toolbar-popover-panel">
          <label class="run"><span class="muted" data-i18n="run">実行バンドル</span><select id="run" data-i18n-aria="run" aria-label="実行バンドル選択"></select></label>
          <span id="run-fp" class="members" aria-live="polite"></span>
        </div>
      </details>
      <details class="app-settings toolbar-popover">
        <summary class="button-toolbar" data-i18n-aria="settings" aria-label="表示設定"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#settings"></use></svg><span class="toolbar-label" data-i18n="settings">表示設定</span></summary>
        <div class="toolbar-popover-panel">
          <button id="theme" type="button" class="button-secondary" data-i18n="theme" data-i18n-aria="theme" aria-label="テーマ切替">テーマ</button>
          <button id="density" type="button" class="button-secondary" data-i18n="density" data-i18n-aria="density" aria-label="表示密度">表示密度</button>
          <button id="language" type="button" class="button-secondary" lang="en" aria-label="Switch to English">English</button>
        </div>
      </details>
      <details id="system-status" class="system-status toolbar-popover">
        <summary class="button-toolbar" data-i18n-aria="statusTitle" aria-label="システム状態"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#status"></use></svg><span class="toolbar-label" data-i18n="statusTitle">システム状態</span></summary>
        <div id="status-strip" class="status-strip toolbar-popover-panel" role="status" aria-live="polite" hidden><span data-i18n="statusTitle">システム状態</span></div>
      </details>
    </div>
  </header>
  <div class="shell">
    <nav id="primary-navigation" class="side" data-i18n-aria="sections" aria-label="セクション"></nav>
    <div id="nav-resizer" class="side-resizer" role="separator" aria-orientation="vertical" data-i18n-aria="resizeNavigation" aria-label="ナビゲーション幅を変更" aria-valuemin="220" aria-valuemax="420" aria-valuenow="256" tabindex="0" hidden></div>
    <button id="nav-scrim" class="side-scrim" type="button" data-i18n-aria="closeNavigation" aria-label="ナビゲーションを閉じる" tabindex="-1" hidden></button>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="palette" role="dialog" aria-modal="true" hidden data-i18n-aria="palette" aria-label="コマンドパレット">
    <div class="box">
      <input id="palette-input" data-i18n-placeholder="paletteHint" data-i18n-aria="palette" type="search" role="combobox" aria-autocomplete="list" placeholder="検索・移動…（例：N0000123）" autocomplete="off" aria-controls="palette-results" aria-activedescendant="">
      <ul id="palette-results" role="listbox" tabindex="-1"></ul>
      <p id="palette-stat" role="status" aria-live="polite" class="members"></p>
    </div>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
