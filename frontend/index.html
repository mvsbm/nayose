<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nayose 照合監査ダッシュボード — エンティティ照合の検索・レビュー・監査">
  <meta name="theme-color" content="#f6f7fb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <title>Nayose 照合監査</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#view">本文へスキップ</a>
  <header class="glass">
    <h1>Nayose <span class="muted">照合監査</span></h1>
    <label class="run"><span class="muted">run</span>
      <select id="run" aria-label="実行バンドル選択"></select>
    </label>
    <span id="run-fp" class="members" aria-live="polite"></span>
    <button id="cmd" type="button" class="chip" aria-label="コマンドパレット">⌘K 検索</button>
    <button id="theme" type="button" class="chip" aria-label="テーマ切替">テーマ</button>
  </header>
  <div class="shell">
    <nav class="glass side" aria-label="セクション">
      <a href="#/search" data-nav="search">検索</a>
      <a href="#/review" data-nav="review">レビュー待機</a>
      <a href="#/entities" data-nav="entities">エンティティ</a>
      <a href="#/confusion" data-nav="confusion">混同行列</a>
      <a href="#/metrics" data-nav="metrics">指標</a>
      <a href="#/compare-runs" data-nav="compare-runs">比較</a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="palette" hidden aria-label="コマンドパレット">
    <div class="glass box">
      <input id="palette-input" type="search" placeholder="検索・移動…（例：N0000123）" autocomplete="off" aria-controls="palette-results" aria-activedescendant="">
      <ul id="palette-results" role="listbox" tabindex="-1"></ul>
      <p id="palette-stat" role="status" aria-live="polite" class="members"></p>
    </div>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
